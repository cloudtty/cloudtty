name: Build & Release Kylin Image

# Builds the Kylin-based CloudShell image (docker/cloudshell/Dockerfile.kylin)
# and publishes it as ghcr.io/cloudtty/cloudshell-kylin:<version>.
#
#   - push to main            => ghcr.io/cloudtty/cloudshell-kylin:latest
#   - version tag (v*)        => ghcr.io/cloudtty/cloudshell-kylin:<tag>
#   - pull request            => build-only validation, no push
#   - workflow_dispatch       => manual build & push

env:
  # ghcr.io/cloudtty/cloudshell-kylin:latest
  IMAGE_REPO: cloudtty
  REGISTER: ghcr.io
  IMAGE_ROOT_PATH: docker
  IMAGE_NAME: cloudshell-kylin
  BUILD_PLATFORM: linux/amd64,linux/arm64
  REGISTER_USER: ${{ github.actor }}
  REGISTER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docker/cloudshell/Dockerfile.kylin'
      - 'docker/cloudshell/script/**'
      - 'html/**'
      - '.github/workflows/build-kylin-image.yaml'
  push:
    branches:
      - main
    paths:
      - 'docker/cloudshell/Dockerfile.kylin'
      - 'docker/cloudshell/script/**'
      - 'html/**'
      - '.github/workflows/build-kylin-image.yaml'
    tags:
      - v*

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Get the version
        id: get_version
        run: |
          REF=${GITHUB_REF}
          VERSION=""
          if [[ ${REF} == "refs/heads/main" ]]; then
            VERSION=latest
          elif [[ ${REF} == refs/heads/* ]]; then
            VERSION=${REF#refs/heads/}
            VERSION=${VERSION//\//-}
          elif [[ ${REF} == refs/tags/* ]]; then
            VERSION=${REF#refs/tags/}
          fi
          if [[ -z ${VERSION} ]]; then
            VERSION=$(echo "${GITHUB_SHA}" | cut -c1-7)
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ env.REGISTER_PASSWORD }}" | docker login ${{ env.REGISTER }} -u ${{ env.REGISTER_USER }} --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Kylin cloudshell image
        uses: docker/build-push-action@v5.1.0
        with:
          context: .
          file: ${{ env.IMAGE_ROOT_PATH }}/cloudshell/Dockerfile.kylin
          labels: |-
            org.opencontainers.image.source=https://github.com/${{ env.IMAGE_REPO }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: ${{ env.BUILD_PLATFORM }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}
          tags: ${{ env.REGISTER }}/${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          github-token: ${{ env.REGISTER_PASSWORD }}
