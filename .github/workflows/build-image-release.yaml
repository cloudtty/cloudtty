name: Build & Release Image

env:
  # ghcr.io/cloudtty/cloudtty/cloudshell:latest => ghcr.io/cloudtty/cloudshell:latest
  # IMAGE_REPO: ${{ github.repository }}
  IMAGE_REPO: cloudtty
  REGISTER: ghcr.io
  IMAGE_ROOT_PATH: docker
  BUILD_PLATFORM: linux/amd64,linux/arm64
  REGISTER_USER: ${{ github.actor }}
  REGISTER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'html/**'
      - '.github/workflows/build-image-release.yaml'
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'html/**'
      - '.github/workflows/build-image-release.yaml'
    tags:
      - v*

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Get the version
        id: get_version
        run: |
          REF=${GITHUB_REF}
          VERSION=""
          if [[ ${REF} == "refs/heads/main" ]]; then
            VERSION=latest
          elif [[ ${REF} == refs/heads/* ]]; then
            VERSION=${REF#refs/heads/}
            VERSION=${VERSION//\//-}
          elif [[ ${REF} == refs/tags/* ]]; then
            VERSION=${REF#refs/tags/}
          fi
          if [[ -z ${VERSION} ]]; then
            VERSION=$(echo "${GITHUB_SHA}" | cut -c1-7)
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ env.REGISTER_PASSWORD }}" | docker login ${{ env.REGISTER }} -u ${{ env.REGISTER_USER }} --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Pushing operator image
        uses: docker/build-push-action@v5.1.0
        with:
          context: .
          file: ${{ env.IMAGE_ROOT_PATH }}/operator/Dockerfile
          labels: |-
            org.opencontainers.image.source=https://github.com/${{ env.IMAGE_REPO }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: ${{ env.BUILD_PLATFORM }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}
          tags: ${{ env.REGISTER }}/${{ env.IMAGE_REPO }}/cloudshell-operator:${{ steps.get_version.outputs.VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          github-token: ${{ env.REGISTER_PASSWORD }}

      - name: Build & Pushing cloudshell image
        uses: docker/build-push-action@v5.1.0
        with:
          context: .
          file: ${{ env.IMAGE_ROOT_PATH }}/cloudshell/Dockerfile
          labels: |-
            org.opencontainers.image.source=https://github.com/${{ env.IMAGE_REPO }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: ${{ env.BUILD_PLATFORM }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}
          tags: ${{ env.REGISTER }}/${{ env.IMAGE_REPO }}/cloudshell:${{ steps.get_version.outputs.VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          github-token: ${{ env.REGISTER_PASSWORD }}

      - name: Build & Pushing cloudshell kylin image
        uses: docker/build-push-action@v5.1.0
        with:
          context: .
          file: ${{ env.IMAGE_ROOT_PATH }}/cloudshell/Dockerfile.kylin
          labels: |-
            org.opencontainers.image.source=https://github.com/${{ env.IMAGE_REPO }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: ${{ env.BUILD_PLATFORM }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}
          tags: ${{ env.REGISTER }}/${{ env.IMAGE_REPO }}/cloudshell-kylin:${{ steps.get_version.outputs.VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          github-token: ${{ env.REGISTER_PASSWORD }}
